[package]
name = "ruststream"
version = "1.0.0"
edition = "2024"

[dependencies]
froodi = { path = "../../froodi", features = ["ruststream"] }
ruststream = { version = "0.7.0-rc.7", features = ["macros", "memory"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.36", features = ["rt", "macros"] }
