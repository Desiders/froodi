[package]
name = "froodi"
version = "1.0.0-beta.18"
edition = "2021"
authors = ["Desiders"]
license = "Apache-2.0"
repository = "https://github.com/Desiders/froodi"

description = "An ergonomic Rust IoC container"
keywords = ["ioc", "di", "dependency-injection"]
categories = ["no-std", "development-tools", "config"]

rust-version = "1.71.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "thread_safe"]

std = ["anyhow/std", "thiserror/std", "tracing/std", "telers?/std"]

thread_safe = []
lock-parking-lot = ["thread_safe", "std", "dep:parking_lot"]
lock-spin = ["thread_safe", "dep:spin"]

async = ["tokio", "tokio/sync", "std"]

axum = ["dep:axum", "axum/ws", "dep:tower-layer", "dep:tower-service", "thread_safe", "std"]
http2-axum = ["dep:h2", "axum", "axum/http2"]

dptree = ["dep:dptree", "thread_safe", "std"]

telers = ["dep:telers", "thread_safe", "std"]

ruststream = ["dep:ruststream", "thread_safe", "tokio/rt", "std"]

[dependencies]
anyhow = { version = "1.0", default-features = false }
axum = { version = ">= 0.6, <= 0.8", default-features = false, optional = true }
dptree = { version = "0.5", optional = true }
froodi-macros = { version = "1", path = "../froodi-macros" }
h2 = { version = "0.4", optional = true }
parking_lot = { version = "0.12", default-features = false, optional = true }
spin = { version = "0.12", features = ["mutex", "rwlock", "spin_mutex"], default-features = false, optional = true }
ruststream = { version = "0.7.0-rc.7", default-features = false, optional = true }
telers = { version = ">= 1.0.0-beta.1, < 1.0.0", default-features = false, optional = true }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", default-features = false, optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1", default-features = false }

[build-dependencies]
version_check = "0.9"

[dev-dependencies]
axum = { version = "0.8" }
axum-test = { version = "18", features = ["ws"] }
criterion = { version = "0.7", features = ["async_tokio"] }
froodi-auto = { version = "1.0", path = "../froodi-auto", default-features = false }
prettyplease = "0.2"
ruststream = { version = "0.7.0-rc.7", features = ["testing", "memory", "macros", "json"] }
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
tracing-test = { version = "0.2", default-features = false }
trybuild = "1"

[[bench]]
name = "sync_container_init"
path = "benches/init/sync.rs"
harness = false
test = false
doctest = false
doc = false
required-features = []

[[bench]]
name = "async_container_init"
path = "benches/init/async.rs"
harness = false
test = false
doctest = false
doc = false
required-features = ["async"]

[[bench]]
name = "container_resolve"
path = "benches/resolve/sync.rs"
harness = false
test = false
doctest = false
doc = false
required-features = []

[[bench]]
name = "async_container_resolve"
path = "benches/resolve/async.rs"
harness = false
test = false
doctest = false
doc = false
required-features = ["async"]

[[bench]]
name = "container_resolve_concurrent"
path = "benches/resolve/concurrent/sync.rs"
harness = false
test = false
doctest = false
doc = false
required-features = ["thread_safe"]

[[bench]]
name = "async_container_resolve_concurrent"
path = "benches/resolve/concurrent/async.rs"
harness = false
test = false
doctest = false
doc = false
required-features = ["async", "thread_safe"]

[[bench]]
name = "registry_lifecycle"
path = "benches/compare/registry.rs"
harness = false
required-features = ["thread_safe"]

[[bench]]
name = "construct_compare"
path = "benches/compare/construct.rs"
harness = false
required-features = ["thread_safe"]

[[bench]]
name = "fragment_compare"
path = "benches/compare/fragments.rs"
harness = false

[[test]]
name = "auto_registration_async"
path = "tests/auto/async.rs"
bench = false
doctest = false
doc = false
required-features = ["async", "froodi-auto/async", "froodi-auto/macros"]

[[test]]
name = "auto_registration_mixed"
path = "tests/auto/mixed.rs"
bench = false
doctest = false
doc = false
required-features = ["async", "froodi-auto/async", "froodi-auto/macros"]

[[test]]
name = "auto_registration_sync"
path = "tests/auto/sync.rs"
bench = false
doctest = false
doc = false
required-features = ["froodi-auto/macros"]
