[package]
name = "froodi-macros"
version = "1.0.0"
edition = "2021"
authors = ["Desiders"]
license = "Apache-2.0"
repository = "https://github.com/Desiders/froodi"

description = "Procedural macros for Froodi and froodi-auto"
keywords = ["macros", "syn", "ioc", "di", "dependency-injection"]
categories = ["no-std", "development-tools", "config"]

rust-version = "1.68.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[features]
default = []
compiled = ["dep:prettyplease"]

[dependencies]
prettyplease = { version = "0.2", optional = true }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
